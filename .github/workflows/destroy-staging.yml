name: Destroy Staging Environment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-staging" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  TF_VERSION: '1.9.0'
  ENVIRONMENT: staging
  PROJECT_NAME: nginx-ecs-app

jobs:
  validate-input:
    name: Validate Destruction Request
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "destroy-staging" ]; then
            echo "❌ Confirmation failed. You must type 'destroy-staging' to proceed."
            exit 1
          fi
          echo "✅ Confirmation validated"

  terraform-destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest
    needs: validate-input
    environment:
      name: staging-destroy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/${{ env.ENVIRONMENT }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy Plan
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        run: |
          cd terraform/environments/${{ env.ENVIRONMENT }}
          terraform apply -auto-approve destroy.tfplan

      - name: Cleanup ECR Images
        continue-on-error: true
        run: |
          REPO_NAME="${PROJECT_NAME}-${ENVIRONMENT}"
          if aws ecr describe-repositories --repository-names "$REPO_NAME" --query 'repositories[0].repositoryName' --output text >/dev/null 2>&1; then
            echo "Deleting ECR repository: $REPO_NAME"
            aws ecr delete-repository --repository-name "$REPO_NAME" --force
          else
            echo "ECR repository $REPO_NAME not found, skipping"
          fi

      - name: Destruction Summary
        run: |
          echo "## 🗑️ Environment Destroyed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ env.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Destroyed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
